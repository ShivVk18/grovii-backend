# Render Blueprint: Grovii backend, production.
# API + worker (Docker), Postgres and Key Value (Redis). The frontend runs on Vercel.
# Secrets marked "sync: false" are entered once in the Render dashboard; never commit them.
# Field names follow Render's Blueprint spec; check them in the dashboard preview before applying.
services:
  - type: web
    name: grovii-api-production
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: grovii api
    plan: standard
    region: oregon
    branch: production
    autoDeploy: false
    # Migrations run before the new version gets traffic; a failure stops the deploy.
    preDeployCommand: grovii migrate
    healthCheckPath: /ready
    envVars:
      - fromGroup: grovii-production
      - key: DATABASE_URL
        fromDatabase: { name: grovii-db-production, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: grovii-redis-production, property: connectionString }

  - type: worker
    name: grovii-worker-production
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: grovii worker
    plan: standard
    region: oregon
    branch: production
    autoDeploy: false
    numInstances: 2
    envVars:
      - fromGroup: grovii-production
      - key: DATABASE_URL
        fromDatabase: { name: grovii-db-production, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: grovii-redis-production, property: connectionString }

  - type: keyvalue
    name: grovii-redis-production
    plan: standard
    region: oregon
    # A job queue must never evict keys (see deploy/redis.conf for the reasoning).
    maxmemoryPolicy: noeviction
    ipAllowList: []          # private network only

databases:
  - name: grovii-db-production
    databaseName: grovii
    user: grovii
    plan: basic-1gb
    region: oregon
    postgresMajorVersion: "18"
    ipAllowList: []          # private network only

envVarGroups:
  - name: grovii-production
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_FORMAT
        value: json
      - key: CORS_ORIGINS
        sync: false          # https://<your Vercel production domain>
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PROXY_SHARED_SECRET
        sync: false          # same value as PROXY_SHARED_SECRET on Vercel (production)
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PRICE_INPUT_PER_M
        sync: false
      - key: LLM_PRICE_OUTPUT_PER_M
        sync: false
      - key: DAILY_SPEND_LIMIT_USD
        value: "20"
      - key: METRICS_TOKEN
        generateValue: true
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
