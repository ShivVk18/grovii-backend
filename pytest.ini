[pytest]
# Only collect the real test suite. The old root scripts (test_api.py,
# test_graph.py) run live HTTP / OpenAI calls at import time, so they must
# never be collected by accident.
testpaths = tests
addopts = -p no:cacheprovider
xfail_strict = true
markers =
    regression: reproduces a bug from eval/FINAL_REPORT.md
