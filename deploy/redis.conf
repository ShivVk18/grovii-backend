# Redis for Grovii: job queue + rate limits + login lockout + alert dedupe.
# A queue must not lose or evict jobs silently.

# Persistence: append-only file, fsync every second (lose at most ~1 s of
# writes on a crash), plus periodic snapshots for faster restarts.
appendonly yes
appendfsync everysec
save 900 1
save 300 100

# Memory: hard cap, and NO eviction. When full, Redis refuses new writes, so
# the API returns 503 "queue_unavailable" (credits refunded) instead of
# silently dropping queued jobs or rate-limit counters.
maxmemory 256mb
maxmemory-policy noeviction

# Network: only reachable inside the private network; require a password
# (set via --requirepass from REDIS_PASSWORD in compose).
protected-mode yes
