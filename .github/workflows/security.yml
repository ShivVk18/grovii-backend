name: tests-and-security

# Runs the whole test suite (including the Phase F security tests: IDOR matrix,
# sessions/CSRF, headers, input abuse) against real Postgres and Redis, and
# fails on any known-vulnerable dependency.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"   # weekly: new advisories appear without code changes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: grovii
          POSTGRES_PASSWORD: grovii-ci-only   # gitleaks:allow (throwaway CI database)
          POSTGRES_DB: grovii_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U grovii" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://grovii:grovii-ci-only@localhost:5432/grovii_test   # gitleaks:allow
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Security tests
        run: python -m pytest -q tests/test_idor_matrix.py tests/test_security_hardening.py tests/test_jwt_security.py tests/test_rate_limits.py tests/test_prompt_injection.py tests/test_validation.py
      - name: Full test suite
        run: python -m pytest -q
      - name: Migrations apply cleanly
        env:
          DATABASE_URL: postgresql://grovii:grovii-ci-only@localhost:5432/grovii_migrate_test   # gitleaks:allow
        run: |
          PGPASSWORD=grovii-ci-only psql -h localhost -U grovii -d grovii_test -c "CREATE DATABASE grovii_migrate_test"
          export JWT_SECRET_KEY="$(python -c 'import secrets;print(secrets.token_urlsafe(64))')"
          alembic upgrade head && alembic check

  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: pip-audit (fails on any known vulnerability)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner off
